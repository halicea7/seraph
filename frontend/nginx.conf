server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # `backend` only resolves inside the compose network. A literal hostname
    # in proxy_pass is resolved once at startup, so if it can't resolve yet
    # (container start ordering) or at all (this image run standalone, e.g.
    # the CI smoke-test's plain `docker run`), nginx fails to start entirely
    # — serving *nothing*, not just the backend-proxied routes. Docker's
    # embedded DNS (127.0.0.11, available on any user-defined bridge network)
    # plus a variable in proxy_pass defers resolution to request time instead:
    # nginx starts regardless, and only a request that actually hits /api/,
    # /ws/, or /a/ can fail (502) if `backend` truly isn't reachable.
    resolver 127.0.0.11 valid=10s;

    # API proxy — forward real client IP for rate limiting
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow reasonably large request bodies (evidence uploads, etc.)
        client_max_body_size 64m;
    }

    # WebSocket proxy
    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep WebSocket connections alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Agent install short URLs (/a/<code>)
    location /a/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
